<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Sign up form</title>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <div class="heading">
                <img src="./images/odin-lined (1).png" alt="odin logo" width="80px" height="80px">
                <h1>ODIN</h1>
            </div>
        </div>

        <div class="main">
            <div class="text-section">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p>You know you want to.</p>
            </div>
            <div class="form-section">
                <form action="#" method="post">
                    <div class="input-section">
                        <h2>Let's do this!</h2>
                        <div class="inputs">
                            <div>
                                <div>
                                    <label for="f_name">FIRST NAME</label>
                                    <input type="text" name="f_name" id="f_name" placeholder="sly" required>
                                </div>
                                <div>
                                    <label for="l_name">LAST NAME</label>
                                    <input type="text" name="l_name" id="l_name" placeholder="mbah" required>
                                </div>
                            </div>
                            <div>
                                <div>
                                    <label for="email">EMAIL</label>
                                    <input type="email" name="email" id="email" required>
                                </div>
                                <div>
                                    <label for="phone-no">PHONE NUMBER</label>
                                    <input type="number" name="phone-no" id="phone-no" required>
                                </div>
                            </div>
                            <div>
                                <div>
                                    <label for="password">PASSWORD</label>
                                    <input type="password" name="password" id="password" required>
                                </div>
                                <div>
                                    <label for="c_password">CONFIRM PASSWORD</label>
                                    <input type="password" name="c_password" id="c_password" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
                <p class="login-text">Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
